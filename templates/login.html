<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in · Facility Switch Gate</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=1">
</head>
<body>
  <div class="card">
    <div class="brand" style="display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:700;font-size:16px;">
      <span class="logo" style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#4f46e5);display:inline-flex;align-items:center;justify-content:center;color:#fff;">⚡</span>
      Facility Switch Gate
    </div>
    <h1>Sign in</h1>
    <p class="sub">Log in with your own Uniware account.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="post" autocomplete="off">
      <label for="username">Uniware Username</label>
      <input type="text" id="username" name="username" required autofocus placeholder="you@zouk.co.in">

      <label for="password">Uniware Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <button type="submit">Log in</button>
    </form>
    <p class="note">Your password is used only to log in to Uniware and is never stored. Only a temporary access token is kept for your session.</p>
  </div>
</body>
</html>
