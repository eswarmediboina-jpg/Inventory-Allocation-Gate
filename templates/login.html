<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in · Orderly</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=2">
</head>
<body>
  <div class="card">
    <div class="brand" style="display:flex;align-items:center;gap:10px;margin-bottom:18px;font-weight:700;font-size:18px;color:#0b485d;">
      <span class="logo" style="width:32px;height:32px;border-radius:3px;background:#0d485d;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">O</span>
      Orderly
    </div>
    <h1>Sign in</h1>
    <p class="sub">Log in with your own Uniware account.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="post" autocomplete="off">
      <label for="username">Uniware Username</label>
      <input type="text" id="username" name="username" required autofocus placeholder="you@zouk.co.in">

      <label for="password">Uniware Password</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <button type="submit">Log in</button>
    </form>
    <p class="note">Your password is used only to log in to Uniware and is never stored. Only a temporary access token is kept for your session.</p>
  </div>
</body>
</html>
